<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Island">
<meta name="theme-color" content="#DCE3EA">
<title>Rainbow Letter Islands</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: one centered play stage (max 720px) that swaps scenes: title, map, story, battle, gate. Single storybook look by choice. */
:root{
  --fog:#DCE3EA;      /* grey fog world */
  --fog-deep:#9AA6B2;
  --ink:#1F2A44;      /* text */
  --paper:#FBFCFE;    /* panels */
  --pip:#F2A93B;      /* companion / accent */
  --good:#2E9E5B;
  --bad:#D64545;
  --display:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,sans-serif;
  --word:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fog);color:var(--ink);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.stage{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pip);outline-offset:3px}
.panel{background:var(--paper);border-radius:20px;padding:20px;box-shadow:0 3px 0 var(--fog-deep)}
.btn{background:var(--ink);color:var(--paper);font-family:var(--display);font-size:1.25rem;padding:10px 26px;border-radius:999px;box-shadow:0 4px 0 #0c1222}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1222}
.btn.soft{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--fog-deep)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--display)}
.hearts{font-size:1.4rem;letter-spacing:2px;color:var(--bad)}
.crystals{display:flex;gap:6px}
.crystals i{width:16px;height:22px;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);background:var(--fog-deep);opacity:.45}
.crystals i.on{opacity:1}
/* title */
.title{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-block:28px}
.title h1{font-size:clamp(2.2rem,8vw,3.6rem);background:linear-gradient(90deg,#E5484D,#F08C2E,#E8C02A,#2E9E5B,#3A7BD5,#4B4FB8,#8E4EC6);-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{margin:0;max-width:34em;line-height:1.6}
.title input{font-family:var(--word);font-size:1.6rem;text-align:center;padding:8px 14px;border-radius:14px;border:3px solid var(--fog-deep);width:min(260px,100%)}
/* map */
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:520px){.map{grid-template-columns:repeat(2,1fr)}}
.zone{border-radius:18px;padding:14px 10px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--fog-deep);color:#fff;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.zone b{font-family:var(--display);font-size:1.15rem}
.zone small{opacity:.9;font-size:.8rem}
.zone.locked{opacity:.45;cursor:not-allowed}
.zone.next{outline:4px dashed var(--pip);outline-offset:3px}
.zone .n{font-family:var(--display);font-size:.85rem;opacity:.85}
/* story */
.story{display:flex;gap:14px;align-items:flex-start}
.pip{flex:none;width:72px;height:72px}
.bubble{background:var(--paper);border-radius:18px;padding:14px 16px;line-height:1.65;flex:1;min-width:0;position:relative}
.bubble .en{font-family:var(--word);font-size:1.25rem;display:block;margin-bottom:4px}
/* battle */
.arena{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.foe{position:relative;width:180px;height:160px}
.foe svg{width:100%;height:100%;transition:transform .2s}
.foe.hit svg{animation:hit .35s}
.foe.yawn svg{animation:yawn .5s}
@keyframes hit{30%{transform:translateX(-10px) rotate(-6deg)}60%{transform:translateX(8px) rotate(4deg)}}
@keyframes yawn{50%{transform:scale(1.08,.92)}}
.pic{font-size:3.4rem;line-height:1;background:var(--paper);border-radius:50%;width:92px;height:92px;display:grid;place-items:center;box-shadow:0 3px 0 var(--fog-deep)}
.pic.swatch{border:10px solid var(--paper)}
.hp{display:flex;gap:4px}
.hp span{width:28px;height:10px;border-radius:5px;background:var(--bad)}
.hp span.gone{background:var(--fog-deep)}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:54px;height:64px;border-radius:12px;background:var(--paper);border:3px dashed var(--fog-deep);display:grid;place-items:center;font-family:var(--word);font-size:2.4rem;font-weight:700}
.slots.long{gap:4px}.slots.long .slot{width:36px;height:52px;font-size:1.8rem}
.slot.fixed{border-style:solid;border-color:transparent;background:transparent}
.slot.filled{border-style:solid;border-color:var(--good);color:var(--good)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{width:60px;height:60px;border-radius:14px;background:var(--paper);font-family:var(--word);font-size:2rem;font-weight:700;box-shadow:0 4px 0 var(--fog-deep)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fog-deep)}
.tile.used{visibility:hidden}
.tile.glow{animation:glow 1s infinite;background:#FFF1D6}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--pip)}}
.tile.wrong{animation:hit .35s;background:#FBE1E1}
.say{background:var(--pip);color:var(--ink);border-radius:999px;padding:6px 16px;font-family:var(--display)}
.hint{min-height:1.6em;font-weight:700}
.gloss{font-weight:700;color:var(--fog-deep);margin-top:-6px}
.bstage{position:relative;width:100%;height:clamp(210px,42vw,280px);border-radius:18px;overflow:hidden;background:#cfe9f7 center/cover no-repeat}
.bsky{position:absolute;inset:0 0 38% 0;background:linear-gradient(#bfe3f2,#e9f5fb)}
.bsky::before,.bsky::after{content:"";position:absolute;width:90px;height:28px;border-radius:20px;background:#fff;opacity:.85;top:18%;left:12%;box-shadow:40px -10px 0 6px #fff}
.bsky::after{left:62%;top:30%;transform:scale(.8)}
.bground{position:absolute;inset:62% 0 0 0;background:var(--ground);border-top:6px solid rgba(255,255,255,.5)}
.fighter{position:absolute;bottom:8%;width:28%;max-width:150px;aspect-ratio:6/7;z-index:2}
.fighter img,.fighter svg{width:100%;height:100%;object-fit:contain;display:block}
.fighter.hero{left:6%}
.fighter.foe{right:6%}
.fighter.foe.big{width:34%;max-width:190px}
.fighter.foe .fbody{width:100%;height:100%}
.fighter.foe .fbody img{filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.fighter.foe .fbody img.tint{filter:sepia(.6) saturate(3) hue-rotate(300deg)}
.fighter.foe .fbody.calm{filter:saturate(1.6) brightness(1.1)}
.hpbar{position:absolute;top:-10px;left:12%;width:76%;height:9px;border-radius:5px;background:rgba(31,42,68,.25);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .35s}
.foe .hpbar i{background:var(--bad)}
.fighter.atk{animation:heroAtk .5s ease-in-out}
.fighter.foe.atk{animation:foeAtk .5s ease-in-out}
@keyframes heroAtk{45%{transform:translateX(var(--dx)) rotate(10deg)}}
@keyframes foeAtk{45%{transform:translateX(calc(-1 * var(--dx))) rotate(-10deg)}}
.fighter.hurt{animation:hurt .45s}
@keyframes hurt{20%,60%{transform:translateX(-9px);filter:brightness(1.8) saturate(0)}40%,80%{transform:translateX(9px)}}
.fighter.pure .fbody{animation:pure .8s}
@keyframes pure{40%{transform:scale(1.25) rotate(-6deg)}}
.wbubble{position:absolute;top:8%;right:30%;background:var(--paper);border-radius:16px;padding:4px 12px;font-size:2rem;line-height:1.1;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.15);z-index:3}
.wbubble small{display:block;font-size:.75rem;font-weight:700;color:var(--fog-deep)}
.wbubble .sw{display:inline-block;width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0002}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.slash{position:absolute;width:110px;height:110px;border-radius:50%;border:8px solid transparent;border-top-color:#E5484D;border-right-color:#E8C02A;border-bottom-color:#3A7BD5;transform:rotate(-40deg) scale(.4);animation:slash .45s forwards}
@keyframes slash{to{transform:rotate(200deg) scale(1.1);opacity:0}}
.dmg{position:absolute;transform:translateX(-50%);font:800 1.7rem var(--display);color:#fff;-webkit-text-stroke:2px var(--bad);animation:up .9s forwards}
.dmg.miss{-webkit-text-stroke-color:var(--ink)}
@keyframes up{to{transform:translate(-50%,-50px);opacity:0}}
.spark{position:absolute;width:12px;height:12px;border-radius:3px;animation:spark .85s forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
.field{font:inherit;font-size:1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--fog-deep);background:#fff;color:var(--ink);width:100%}
.sea.tall{height:min(74vh,660px)}
.mute{font:700 .75rem var(--display,inherit);padding:3px 10px;margin-left:6px;vertical-align:middle;border-radius:999px;background:var(--paper);color:var(--ink);box-shadow:0 2px 0 var(--fog-deep);border:0;cursor:pointer}
.title-art{width:100%;max-height:300px;object-fit:cover;border-radius:16px;margin-bottom:10px}
.pickhero{display:flex;gap:10px;justify-content:center;margin:6px 0}
.ph{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:14px;border:3px solid transparent;background:var(--paper);font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.ph img{height:76px}
.ph.on{border-color:var(--good)}
.coins{display:inline-flex;align-items:center;gap:5px;font:800 1rem var(--display,inherit);color:#9a6b00;margin-left:auto;margin-right:10px}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE58A,#F2C230 55%,#C99212);box-shadow:inset 0 0 0 2px #E0A91E}
.coinpop{position:absolute;transform:translateX(-50%);display:flex;align-items:center;gap:4px;font:800 1.5rem var(--display,inherit);color:#9a6b00;background:#fff8dc;border-radius:999px;padding:2px 12px;box-shadow:0 3px 0 rgba(0,0,0,.12);animation:coinup 1.6s forwards}
.coinpop .coin{width:22px;height:22px}
@keyframes coinup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px)}}
.timer{position:relative;width:min(100%,360px);height:22px;border-radius:999px;background:rgba(31,42,68,.12);overflow:hidden;margin:2px auto}
.timer i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2E9E5B,#7BC67E);border-radius:999px;transition:width .1s linear}
.timer b{position:relative;display:block;text-align:center;font:800 .95rem/22px var(--display,inherit);color:var(--ink)}
.timer.low i{background:linear-gradient(90deg,#E5484D,#F08C2E)}
.timer.low b{color:#fff}
.kline{font-weight:700;color:var(--fog-deep);text-align:center;font-style:italic}
.skills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.skill{border-radius:999px;padding:5px 14px;background:#FFF6D6;border:2px solid #E8C02A;font-family:var(--display);font-size:.95rem;color:var(--ink)}
.skill b{display:inline-block;min-width:1.4em;margin-left:4px;background:#E8C02A;color:#fff;border-radius:999px}
.skill.egg{background:#FDEFE4;border-color:#E89A5A}.skill.egg b{background:#E89A5A}
.skill:disabled{opacity:.4}
.skill.pop{animation:skpop .5s}
@keyframes skpop{50%{transform:scale(1.15)}}
#deck.fog .card{filter:blur(7px);color:#9aa3aa;background:#e7ebef}
#deck.fog{position:relative}
#deck.fog::after{content:'☁️ ☁️ ☁️';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;pointer-events:none;animation:fogd 2s ease-in-out infinite alternate}
@keyframes fogd{to{transform:translateX(14px)}}
.q.hidq{color:var(--fog-deep);font-family:var(--display)}
.phase{display:inline-block;background:#5B4B8A;color:#fff;border-radius:999px;padding:2px 10px;font-size:.8rem;margin-left:6px}
.diary{background:#EDEAE4;border:2px dashed #9A93A6;border-radius:14px;padding:12px 16px;text-align:center;max-width:560px;margin:0 auto;transform:rotate(-1deg)}
.diary .dtag{font-family:var(--display);color:#5B4B8A;font-size:.9rem}
.diary .en{display:block;font-family:var(--word);font-size:1.3rem;margin:6px 0;color:#3d3a45}
.diary .zh{display:block;font-size:.85rem;color:#77707f}
.diary.new{animation:dnew .8s}
@keyframes dnew{from{transform:rotate(-12deg) scale(.6);opacity:0}}
.diaries{display:grid;gap:12px}
.fighter.hero{container-type:inline-size}
.acc{position:absolute;pointer-events:none;line-height:1;z-index:3}
.acc.hat{top:-14%;left:44%;transform:translateX(-50%) rotate(-8deg);font-size:40cqw}
.acc.pet{bottom:-4%;right:-30%;font-size:40cqw;animation:petb 1.4s ease-in-out infinite}
@keyframes petb{50%{transform:translateY(-12%)}}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sitem{background:var(--paper);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 3px 0 var(--fog-deep);display:flex;flex-direction:column;align-items:center;gap:4px}
.sitem .se{font-size:2.6rem;line-height:1.1;background:none;border:0}
.sitem .sn{font-family:var(--word);font-size:1.1rem}
.sitem small{color:var(--fog-deep)}
.sitem.on{outline:3px solid #E8C02A}
.sitem .btn{font-size:.95rem;padding:6px 14px}
.preview{display:flex;justify-content:center;margin:6px 0 12px}
.preview .fighter{position:relative;bottom:auto;left:auto;width:120px}
.rh{border-radius:18px;padding:14px;margin-bottom:14px;position:relative;overflow:hidden}
.rh h3{font-family:var(--display);margin-bottom:8px}
.rh.home{background:linear-gradient(#FFE9D6,#FFF7EE);border:3px solid #E8A87C}
.rh.home::before{content:'';display:block;height:64px;margin:-14px -14px 10px;background:#E8746A;clip-path:polygon(10% 100%,50% 0,90% 100%)}
.rh.farm{background:linear-gradient(#CDEBFF 0 30%,#BFE3A8 30%);border:3px solid #8DB86F}
.rh.other{background:var(--paper)}
.stks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.stk{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:6px 8px;border-radius:14px;background:rgba(255,255,255,.75);border:0;font:600 .95rem var(--word,inherit)}
.stk span{font-size:2.2rem;line-height:1.1}
.stk.locked span{filter:grayscale(1);opacity:.25}
.stk.locked{color:var(--fog-deep)}
.rh.farm .stk:not(.locked) span{animation:petb 2s ease-in-out infinite}
.rh.farm .stk:nth-child(2n) span{animation-delay:.6s}
.daily{background:var(--paper);border-radius:16px;padding:12px 16px;box-shadow:0 3px 0 var(--fog-deep)}
.daily h3{font-family:var(--display);font-size:1.1rem;margin-bottom:6px}
.dtask{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed #d6dbe0}
.dtask:last-of-type{border-bottom:0}
.dtask .di{font-size:1.4rem}.dtask .dt{flex:1}.dtask .dt small{display:block;color:var(--fog-deep)}
.dtask .dp{font-family:var(--display);color:var(--fog-deep)}
.dtask.done .dp{color:var(--good)}
.daily .btn{margin-top:8px}
.npc{display:flex;gap:14px;align-items:center;justify-content:center;margin:8px 0}
.npc .ne{font-size:4.5rem;line-height:1;animation:petb 1.6s ease-in-out infinite}
.npc .bubble{max-width:520px}
.npcpic{font-size:2.6rem;text-align:center;margin:4px 0}
.npcpic small{display:block;font-size:.9rem;color:var(--fog-deep)}
.opts{display:grid;gap:10px;max-width:560px;margin:10px auto}
.opt{background:var(--paper);border:3px solid #d6dbe0;border-radius:14px;padding:10px 14px;font:600 1.25rem var(--word,inherit);text-align:left}
.opt.right{border-color:var(--good);background:#E7F6EA}
.opt.nope{border-color:#E46A5E;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.choice{background:#FFF6D6;border:2px solid #E8C02A;border-radius:14px;padding:12px 16px;text-align:center;max-width:620px;margin:0 auto}
.choice h3{font-family:var(--display);font-size:1.05rem;margin-bottom:8px}
.choice .row{gap:10px}
.hearts2{color:#E46A5E;font-family:var(--display)}
.pond{position:relative;height:320px;border-radius:18px;overflow:hidden;background:linear-gradient(#9BDCF5,#3E9FD0);margin:8px 0}
.fish{position:absolute;left:-40%;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:0;background:rgba(255,255,255,.9);font:700 1.25rem var(--word,inherit);white-space:nowrap;animation:swim linear infinite}
.fish span{font-size:1.8rem}
.fish.rev{animation-name:swimr}.fish.rev span{transform:scaleX(-1)}
.fish.caught{animation-play-state:paused;background:#E7F6EA;outline:3px solid var(--good)}
.fish.nope{background:#FDE3E0}
@keyframes swim{from{left:-40%}to{left:100%}}
@keyframes swimr{from{left:100%}to{left:-40%}}
.track{position:relative;height:56px;border-radius:999px;background:repeating-linear-gradient(90deg,#d6dbe0 0 18px,#eef1f4 18px 36px);margin:8px 0}
.track .car{position:absolute;top:50%;transform:translate(-50%,-50%) scaleX(-1);font-size:2.4rem;transition:left .4s}
.track .flag{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:2rem}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gamec{background:var(--paper);border:0;border-radius:16px;padding:16px;box-shadow:0 3px 0 var(--fog-deep);text-align:center;font-family:var(--display)}
.gamec span{display:block;font-size:3rem}
.gamec small{display:block;font-family:inherit;color:var(--fog-deep);font-weight:600}
.tug{display:flex;align-items:center;gap:10px;margin:6px 0}
.tug b{font-family:var(--display);min-width:80px;text-align:center}
.tug .rope{flex:1;position:relative;height:14px;border-radius:999px;background:repeating-linear-gradient(45deg,#c9a46a 0 8px,#b08a50 8px 16px)}
.tug .rope i{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:1.8rem;transition:left .5s}
.tug .rope::after{content:'';position:absolute;left:50%;top:-8px;bottom:-8px;border-left:3px dashed #5B4B8A}
.turn{text-align:center;font-family:var(--display);font-size:1.3rem;padding:6px 12px;border-radius:999px;color:#fff;margin:0 auto;width:max-content}
.turn.p0{background:#3E8ED0}.turn.p1{background:#E46A5E}
.pieces{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.pieces .tile.wd{width:auto;padding:0 14px;font-family:var(--word)}
.built{min-height:56px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font:700 1.5rem var(--word,inherit)}
.built .slot{width:auto;min-width:38px;padding:0 6px}
.rep table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:.95rem}
.rep th,.rep td{border-bottom:1px solid #d6dbe0;padding:6px 8px;text-align:left}
.rep th{background:#EEF1F4;font-family:var(--display)}
.rep h3{font-family:var(--display);margin:14px 0 4px}
.rep .kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rep .kpi div{background:#EEF1F4;border-radius:12px;padding:8px 10px}
.rep .kpi b{display:block;font-size:1.4rem;font-family:var(--display)}
.rep .muted{color:var(--fog-deep)}
@media print{body{background:#fff}.hud,.noprint{display:none!important}.panel{box-shadow:none}}
.book{display:flex;flex-direction:column;gap:10px;align-items:center;position:relative}
.bkframe{position:relative;width:100%;aspect-ratio:3/2;border-radius:18px;overflow:hidden;background:#e9dcc8;touch-action:pan-y}
.bkpic{position:absolute;inset:0;background:#cfe9f7 center/cover no-repeat}
.bkhero{position:absolute;left:12%;bottom:6%;height:62%}

  const sea=new T.Mesh(seaG,new T.MeshPhongMaterial({color:'#2F8FC0',flatShading:true,shininess:60,specular:'#88B8D8'}));sea.receiveShadow=true;sea.userData.noShadow=true;scene.add(sea);

   for(let k=3;k<n-2;k++){const t=k/n;const dot=new T.Mesh(new T.CylinderGeometry(.09,.09,.05,8),new T.MeshLambertMaterial({color:'#ffffff'}));dot.position.set(a[0]+(b[0]-a[0])*t,.12,a[1]+(b[1]-a[1])*t);route.add(dot)}}
  scene.add(route);
  const isl=new T.Group();scene.add(isl);
  W={zoom:1,T,r,scene,cam,sea,isl,tgt:new T.Vector3(0,0,1.3),goal:{pos:new T.Vector3(0,18,16),tgt:new T.Vector3(0,0,1.3)},yaw:0,mode:'map',unit:-1,clouds,foams:[],labels:[],spin:[],bob:[],fogs:[],el:null,w:0,h:0,t:0,hits:[]};
  // input
  let down=null;const pts=new Map();let pinch=null;
  const pd=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
  r.domElement.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});r.domElement.setPointerCapture(e.pointerId);
   if(pts.size===2){pinch={d:pd(),z:W.zoom};down=null}else if(pts.size===1)down={x:e.clientX,y:e.clientY,yaw:W.yaw}});
  r.domElement.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
   if(pinch&&pts.size===2){setZoom(pinch.z*pinch.d/Math.max(20,pd()));return}
   if(!down)return;if(Math.abs(e.clientX-down.x)>8){W.dragged=true;W.yaw=down.yaw-(e.clientX-down.x)*0.006;aim()}});
  const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size<2)pinch=null;
   if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved<8&&e.type==='pointerup')pick(e)};
  r.domElement.addEventListener('pointerup',up);r.domElement.addEventListener('pointercancel',up);

  requestAnimationFrame(loop);

 }catch(e){W=false;return null}
}

 const r=await fetch(`https://${AZ.region}.tts.speech.microsoft.com/cognitiveservices/v1`,{method:'POST',headers:{'Ocp-Apim-Subscription-Key':AZ.key,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-24khz-48kbitrate-mono-mp3'},body:ssml});

function campItems(){
 const done=[];for(let i=0;i<Math.min(S.cleared,ZONES.length);i++)done.push(i);if(!done.length)return[];
 const ws=[],ss=[],seen=new Set();
 (S.miss||[]).forEach(m=>{const[t,zs,v]=m.split('|'),zi=+zs;if(!done.includes(zi)||seen.has(m))return;seen.add(m);
  if(t==='w'){const w=ZONES[zi].words.find(x=>x[0]===v);if(w)ws.push({zi,w})}else{const g=(SENT[zi]||[]).find(x=>x.a===v)||ZONES[zi].gate.find(x=>x.a===v);if(g)ss.push({zi,g})}});
 const nw=ws.length,ns=ss.length;
 shuffle(done.flatMap(zi=>ZONES[zi].words.map(w=>({zi,w})))).forEach(x=>{if(ws.length<3&&!ws.some(y=>y.w[0]===x.w[0]))ws.push(x)});

  const pool=DAILY.map((x,i)=>i).filter(i=>(DAILY[i].k!=='camp'||S.cleared>0)&&(DAILY[i].k!=='book'||(S.books||[]).length>1));const pick=[];
  while(pick.length<3&&pool.length){h=(h*1103515245+12345)>>>0;pick.push(pool.splice((h>>>8)%pool.length,1)[0])}

const bookOf=zi=>String(unitOf(zi)+1)+String(UNITS[unitOf(zi)].subs.indexOf(zi)+1);
const nameIn=t=>String(t).replace(/\{name\}/g,S.name||'Hero');
function storyWords(zi){const set=new Set();if(zi==null)return set;const z=ZONES[zi];z.words.forEach(w=>w[0].split(' ').forEach(x=>set.add(x.toLowerCase())));z.gate.forEach(g=>g.a.split(' ').forEach(x=>set.add(x.toLowerCase().replace(/[^a-z']/g,''))));return set}
function storybook(id,done){
 const b=BOOKS[id];if(!b){done();return}
 if(!(S.books||[]).includes(id)){S.books=[...(S.books||[]),id];save()}
 let pg=0,zh=false;const kind=S.hero==='girl'?'girl':'boy',key=storyWords(b.zi);
 const s=b.zi!=null?SPR[b.zi]:null;
 const fallback=who=>{const bg=b.bg?IMG[b.bg]:s&&IMG[s.bg];const hero=IMG['hero-'+kind]||IMG['hero-boy'];
  const other=who==='pip'?IMG.pip:who==='keeper'?(s&&IMG[s.k]):who==='color'?(s&&IMG[s.m+'-color']):who==='mumble'||who==='fog'?IMG['boss-mumble']:who==='bell'?null:IMG.pip;
  const plain=b.bg==='title'&&bg;
  return `<div class="bkpic" style="${bg?`background-image:url(${bg})`:''}">${who==='fog'?'<div class="bkfog"></div>':''}${hero&&!plain&&who!=='bell'&&who!=='fog'?`<img class="bkhero" src="${hero}" alt="">`:''}${other&&!plain?`<img class="bkother" src="${other}" alt="">`:''}${who==='bell'?'<div class="bkbell">🔔</div>':''}</div>`};
 const words=t=>t.split(/(\s+)/).map(w=>{if(/^\s+$/.test(w))return w;const c=w.toLowerCase().replace(/[^a-z']/g,'');if(!c)return esc(w);return `<button class="bw ${key.has(c)?'key':''}" data-w="${esc(c)}">${esc(w)}</button>`}).join('');
 function draw(){const [en,cn,who]=b.pages[pg],last=pg===b.pages.length-1;
  app.innerHTML=`<div class="panel book">
   <div class="hud" style="width:100%"><span>Storybook · ${esc(b.title)}</span><span>${pg+1} / ${b.pages.length}</span></div>
   <div class="bkframe">${fallback(who)}<img class="bkart" src="img/book-${id}-${pg+1}-${kind}.jpg" alt="" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='img/book-${id}-${pg+1}-${kind==='boy'?'girl':'boy'}.jpg'}else this.remove()"></div>
   <p class="bktext">${words(nameIn(en))}</p>
   ${zh?`<p class="bkzh">${esc(cn)}</p>`:''}
   ${last&&b.end?`<p class="bkend">${esc(b.end)}</p>`:last?'<p class="bkend">To be continued...</p>':''}
   <div class="row"><button class="btn soft" id="bprev" ${pg?'':'disabled style="opacity:.4"'}>◀ Back</button><button class="say" id="bsay">🔊 Listen</button><button class="btn" id="bnext">${last?esc(b.cta||'Next!'):'Next ▶'}</button></div>
   <button class="zhbtn" id="bzh" aria-pressed="${zh}">中文</button></div>`;
  speak(nameIn(en));
  app.querySelectorAll('.bw').forEach(x=>x.onclick=()=>speak(x.dataset.w,1));
  document.getElementById('bsay').onclick=()=>speak(nameIn(en));
  document.getElementById('bzh').onclick=()=>{zh=!zh;draw()};
  document.getElementById('bprev').onclick=()=>{if(pg){pg--;draw()}};
  document.getElementById('bnext').onclick=()=>{if(last)done();else{pg++;draw()}};
  let sx=null;const fr=app.querySelector('.bkframe');fr.addEventListener('pointerdown',e=>sx=e.clientX);fr.addEventListener('pointerup',e=>{if(sx==null)return;const d=e.clientX-sx;sx=null;if(d<-40&&!last){pg++;draw()}else if(d>40&&pg){pg--;draw()}});
 }
 draw();
}
function shelf(back){
 const ids=Object.keys(BOOKS).filter(id=>(S.books||[]).includes(id));
 app.innerHTML=hud()+`<div class="panel"><h2 style="font-size:1.5rem;margin-bottom:10px">Storybooks</h2>
  ${(S.diary||[]).length?`<div class="row" style="margin-bottom:10px"><button class="btn soft" id="diaryb">📔 Mumble's Diary (${S.diary.length} / ${DIARY.length})</button></div>`:''}
  ${ids.length?`<div class="shelf">${ids.map(id=>{const b=BOOKS[id],s=b.zi!=null?SPR[b.zi]:null,bg=b.bg?IMG[b.bg]:s&&IMG[s.bg];return `<button class="bookbtn" data-id="${id}"><span class="cover" style="${bg?`background-image:url(${bg})`:''}"></span><b>${esc(b.title)}</b></button>`}).join('')}</div>`:'<p>Clear a stage to get a storybook!</p>'}
  <div class="row"><button class="btn soft" id="sback">Back to map</button></div></div>`;
 app.querySelectorAll('.bookbtn').forEach(x=>x.onclick=()=>(dly('book'),storybook)(x.dataset.id,()=>shelf(back)));
 const db=document.getElementById('diaryb');if(db)db.onclick=()=>diaryBook(()=>shelf(back));
 document.getElementById('sback').onclick=back||map;
}

// ---------- background music: map/island theme and battle theme ----------
const BGM={want:null,cur:null,els:{},vol:{map:.3,battle:.34},on:true,duckT:0};
try{BGM.on=localStorage.getItem('rq-music')!=='off'}catch(e){}
function bgmEl(n){return BGM.els[n]||(BGM.els[n]=Object.assign(new Audio('audio/'+n+'.mp3'),{loop:true,preload:'auto',volume:BGM.vol[n]}))}
function bgm(n){BGM.want=n;if(!BGM.on)return;
 for(const k in BGM.els)if(k!==n)BGM.els[k].pause();
 const a=bgmEl(n);if(BGM.cur!==n&&n==='battle')a.currentTime=0;BGM.cur=n;a.play().catch(()=>{})}
function bgmToggle(){BGM.on=!BGM.on;try{localStorage.setItem('rq-music',BGM.on?'on':'off')}catch(e){}
 if(BGM.on){BGM.cur=null;bgm(BGM.want||'map')}else for(const k in BGM.els)BGM.els[k].pause();
 document.querySelectorAll('.mute').forEach(b=>{b.textContent=BGM.on?'♫ Music on':'♫ Music off';b.setAttribute('aria-pressed',String(!BGM.on))})}
function bgmDuck(ms){for(const k in BGM.els)BGM.els[k].volume=BGM.vol[k]*.3;clearTimeout(BGM.duckT);BGM.duckT=setTimeout(()=>{for(const k in BGM.els)BGM.els[k].volume=BGM.vol[k]},ms)}
// browsers only allow sound after the first tap
addEventListener('pointerdown',function first(){if(BGM.on&&BGM.want){const a=bgmEl(BGM.want);if(a.paused)a.play().catch(()=>{})}},{capture:true});
function muteHtml(){return `<button class="mute" onclick="bgmToggle()" aria-pressed="${!BGM.on}">${BGM.on?'♫ Music on':'♫ Music off'}</button>`}
{const wrap=(fn,m)=>function(){bgm(m);return fn.apply(this,arguments)};
 battle=wrap(battle,'battle');gate=wrap(gate,'battle');sentQ=wrap(sentQ,'battle');campEnd=wrap(campEnd,'map');
 title=wrap(title,'map');map=wrap(map,'map');unitMap=wrap(unitMap,'map');mapGrid=wrap(mapGrid,'map');unitGrid=wrap(unitGrid,'map');story=wrap(story,'map');arena=wrap(arena,'map');clear=wrap(clear,'map');
 const sp=speak;speak=function(t){bgmDuck(String(t).length>12?3200:1400);return sp.apply(this,arguments)}}

title();
</script>
