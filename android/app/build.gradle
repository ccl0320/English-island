plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.ccl0320.englishisland'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ccl0320.englishisland'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // A fixed key (not secret, classroom use) so each new APK installs over the old one
    // and keeps the child's progress.
    signingConfigs {
        classroom {
            storeFile file('classroom.keystore')
            storePassword 'android'
            keyAlias 'classroom'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.classroom
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
